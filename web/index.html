<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>
    <div class="grid"></div>

    <main class="jarvis">

        <!-- TOP BAR -->
        <header class="top-bar">

            <div class="logo">
                <div class="logo-circle">J</div>

                <div>
                    <h1>JARVIS</h1>
                    <span>JUST A RATHER VERY INTELLIGENT SYSTEM</span>
                </div>
            </div>

            <div class="system-status">
                <span class="status-light"></span>
                SYSTEM ONLINE
            </div>

        </header>


        <!-- MAIN CENTER -->
        <section class="main-screen">

            <div class="core-container">

                <!-- OUTER ROTATING RINGS -->
                <div class="core-ring ring-1"></div>
                <div class="core-ring ring-2"></div>
                <div class="core-ring ring-3"></div>

                <!-- PARTICLE RING -->
                <div class="particle-ring">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- CORE -->
                <div class="core">

                    <div class="core-inner">
                        <div class="core-letter">J</div>
                    </div>

                </div>

            </div>


            <!-- STATUS UNDER CORE -->

            <div class="voice-status">

                <div id="voiceState">READY</div>

                <div class="voice-bars">
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>
                </div>

                <p id="statusText">
                    SAY "JARVIS" TO BEGIN
                </p>

            </div>

        </section>


        <!-- CONVERSATION -->

        <section class="conversation-panel">

            <div class="panel-header">
                <span>CONVERSATION</span>
                <span id="connectionStatus">CONNECTED</span>
            </div>

            <div id="messages" class="messages">

                <div class="message jarvis-message">
                    <span class="message-name">JARVIS</span>
                    <p>Hello. Systems are ready.</p>
                </div>

            </div>


            <!-- INPUT -->

            <div class="command-box">

                <input
                    id="commandInput"
                    type="text"
                    placeholder="Type a command..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    SEND
                </button>

                <button id="micButton" title="Voice">
                    🎤
                </button>

            </div>

        </section>


        <!-- SYSTEM INFORMATION -->

        <section class="system-panel">

            <div class="system-item">
                <span>AI ENGINE</span>
                <strong>QWEN</strong>
            </div>

            <div class="system-item">
                <span>MODE</span>
                <strong>FAST</strong>
            </div>

            <div class="system-item">
                <span>MEMORY</span>
                <strong>ACTIVE</strong>
            </div>

            <div class="system-item">
                <span>VOICE</span>
                <strong id="voiceSystem">READY</strong>
            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
